name: Project PULSE CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-windows-agent:
    name: Build & Test Windows Desktop Agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore apps/windows-agent/Pulse.sln

      - name: Build solution
        run: dotnet build apps/windows-agent/Pulse.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test apps/windows-agent/Pulse.Tests/Pulse.Tests.csproj --no-build --verbosity normal

      - name: Publish Agent
        run: dotnet publish apps/windows-agent/Pulse.Agent/Pulse.Agent.csproj -c Release -o publish/Pulse.Agent --no-restore

  test-web-dashboard:
    name: Build & Test Next.js Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify TypeScript
        working-directory: apps/web
        run: npm run typecheck

      - name: Build production bundle
        working-directory: apps/web
        run: npm run build
